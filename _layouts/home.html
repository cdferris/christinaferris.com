<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Christina Ferris</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="icon" type="image/png" href="/assets/favicon.png">
</head>
<body class="home-page">
  {% include nav.html %}
  <main>
    <img class="hero" id="hero" src="" alt="">
  </main>
  <footer class="visually-hidden">
    <p>Christina Ferris</p>
  </footer>

  <script>
    const heroImages = [
      { src: '/assets/images/hero/photo-1.jpg', alt: 'Purple desert flowers; taken in Tucson Arizona' },
      { src: '/assets/images/hero/photo-2.jpg', alt: 'Crow on a windy day, perched on a wooden fence; taken in Portland Oregon' },
      { src: '/assets/images/hero/photo-3.jpg', alt: 'Overlooking the Avon in Bath, U.K.; a rainbow in the distance' },
      { src: '/assets/images/hero/photo-4.jpg', alt: 'My German Shepherd dog, Nadja, smiling with big perky ears, reflected in the sideview mirror of the car, sunset sky behind her' },
      { src: '/assets/images/hero/photo-5.jpg', alt: 'My husband and my dog, small silhouettes at Cannon Beach, Oregon' },
      { src: '/assets/images/hero/photo-6.jpg', alt: 'Merilee running at White Sands, New Mexico; large diagnol white cloud on a blue sky mirrors the white sand; cira 1998' },
      { src: '/assets/images/hero/photo-7.jpg', alt: 'A hotel in Otovalo, Ecudador, sign reads: Residential El Roco; next to the sign on a flat roof stands a golden coloured dog, looking at the camera' },
      { src: '/assets/images/hero/photo-8.jpg', alt: 'A silhouette of a crow on a thick cable, just getting ready to launch into flight, cool winter sky and trees behind' },
      { src: '/assets/images/hero/photo-9.jpg', alt: 'New York City skyline behind a layer of winter trees, from Central Park, a river and path in the foreground, on a clear winter day, December 2001' },
      { src: '/assets/images/hero/photo-10.jpg', alt: 'Looking down a residential street in Bogota, Colombia circa 1996, a small child peers through a barred window' },
      { src: '/assets/images/hero/photo-11.jpg', alt: 'A red Border Collie carrying a mangled monkey toy by its arm, scene from a dog park in Tucson, Arizona circa 2007' },
      { src: '/assets/images/hero/photo-12.jpg', alt: 'From afar: the Capaliano Suspension Bridge, surrounded by giant evergreen trees and a river below; Vancouver, British Columbia, Canada' }
    ];
    const chosen = heroImages[Math.floor(Math.random() * heroImages.length)];
    const hero = document.getElementById('hero');
    hero.src = chosen.src;
    hero.alt = chosen.alt;
  </script>
</body>
</html>
