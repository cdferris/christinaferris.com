<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Christina Ferris</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="icon" type="image/png" href="/assets/favicon.png">
</head>
<body>
  <!-- 1. Add skip link as the very first item inside <body> -->
  <a href="#main-content" class="skip-link">Skip to main content</a>

  {% include nav.html %}

  <!-- 2. Target the main element with the id and tabindex -->
  <main id="main-content" tabindex="-1" class="container">
    {{ content }}
  </main>

  <footer>
    <p>&copy; Christina Ferris @2026</p>
  </footer>
</body>
</html>
